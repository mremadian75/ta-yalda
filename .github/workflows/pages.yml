name: Deploy Ta Yalda to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already in flight — a half-applied deploy is
# worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `enablement: true` is the fix for the previous failure. Without it this
      # step only *reads* the Pages config and dies with "Get Pages site failed
      # … Not Found" when no Pages site exists yet. With it, the job creates the
      # Pages site itself (build_type: workflow) using the `pages: write`
      # permission above, so no manual setting is needed.
      #
      # CAVEAT, and it is not something the workflow can solve: GitHub Pages on
      # a PRIVATE repository requires a paid plan (Pro / Team / Enterprise). On
      # the Free plan this step fails even with enablement: true, because there
      # is no Pages site to create. The repo would have to go public, or the
      # site be hosted elsewhere.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # Publish only the site. `path: .` would also serve README.md and tools/,
      # which are repository furniture, not part of the page.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css app.js data.js favicon.svg robots.txt _site/
          cp -R assets _site/assets
          # Fail loudly here rather than shipping a page that 404s on its config.
          for f in index.html styles.css app.js data.js favicon.svg \
                   assets/fonts/vazirmatn-arabic.woff2 assets/fonts/vazirmatn-latin.woff2; do
            test -s "_site/$f" || { echo "::error::missing from _site: $f"; exit 1; }
          done
          echo "Publishing:"; find _site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
